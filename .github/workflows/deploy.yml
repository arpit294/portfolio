name: Deploy Website to EC2 (Nginx)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Nginx
        run: |
          sudo rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            ./ /var/www/html/

      - name: Verify Nginx
        run: |
          sudo nginx -t
          sudo systemctl reload nginx
